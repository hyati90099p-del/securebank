<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBank — Register</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="bg-animation">
  <span></span><span></span><span></span><span></span><span></span>
</div>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
      <h1>Create Account</h1>
      <p>Join SecureBank — Safe &amp; Secure Banking</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="regName" placeholder="Enter your full name">
      </div>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="regEmail" placeholder="Enter your email">
      </div>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <div class="input-wrap">
        <i class="fas fa-phone"></i>
        <input type="tel" id="regPhone" placeholder="10-digit mobile number" maxlength="10">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="regPassword" placeholder="Create a password (min 6 chars)">
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="regConfirm" placeholder="Re-enter your password">
      </div>
    </div>

    <button class="btn btn-primary" onclick="handleRegister()">
      <i class="fas fa-user-check"></i> Create Account
    </button>
    <div class="auth-link">
      Already have an account? <a href="index.html">Login here</a>
    </div>
  </div>
</div>
<div class="toast-container"></div>
<script src="app.js"></script>
<script>
  function handleRegister() {
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const phone    = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirm').value;

    if (!name || !email || !phone || !password || !confirm) {
      showToast('Please fill in all fields.', 'warning'); return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showToast('Please enter a valid email address.', 'warning'); return;
    }
    if (!/^\d{10}$/.test(phone)) {
      showToast('Phone number must be exactly 10 digits.', 'warning'); return;
    }
    if (password.length < 6) {
      showToast('Password must be at least 6 characters.', 'warning'); return;
    }
    if (password !== confirm) {
      showToast('Passwords do not match.', 'error'); return;
    }

    const result = Auth.register(name, email, phone, password);
    if (!result.success) { showToast(result.msg, 'error'); return; }

    AuditLog.add(result.customer.id, email, 'REGISTER', 'New account created');
    showToast('Account created successfully! Redirecting to login...', 'success');
    setTimeout(() => window.location.href = 'index.html', 1500);
  }
</script>
</body>
</html>
