<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBank — Deposit</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="bg-animation"><span></span><span></span><span></span><span></span><span></span></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <div class="breadcrumb">Home / <span>Deposit</span></div>
      <h2><i class="fas fa-plus-circle text-success"></i> Deposit Funds</h2>
      <p>Add money to your account securely.</p>
    </div>

    <div class="txn-card">
      <div class="balance-info">
        <div class="bi-label"><i class="fas fa-wallet"></i> Current Balance</div>
        <div class="bi-val" id="balanceDisplay">&#8377;0.00</div>
        <div style="font-size:0.78rem;color:var(--text-muted)" id="accInfo">—</div>
      </div>

      <div class="form-group">
        <label>Deposit Amount (&#8377;)</label>
        <div class="input-wrap">
          <i class="fas fa-rupee-sign"></i>
          <input type="number" id="depositAmount" placeholder="Enter amount" min="1" max="1000000">
        </div>
      </div>

      <div class="form-group">
        <label>Description (optional)</label>
        <div class="input-wrap">
          <i class="fas fa-comment-alt"></i>
          <input type="text" id="depositDesc" placeholder="e.g. Salary, Cash deposit">
        </div>
      </div>

      <!-- Quick amount buttons -->
      <div style="margin-bottom:1.2rem">
        <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px">Quick Amount</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="setAmount(1000)">&#8377;1,000</button>
          <button class="btn btn-outline btn-sm" onclick="setAmount(5000)">&#8377;5,000</button>
          <button class="btn btn-outline btn-sm" onclick="setAmount(10000)">&#8377;10,000</button>
          <button class="btn btn-outline btn-sm" onclick="setAmount(25000)">&#8377;25,000</button>
          <button class="btn btn-outline btn-sm" onclick="setAmount(50000)">&#8377;50,000</button>
        </div>
      </div>

      <button class="btn btn-success" style="width:100%;font-size:1rem" onclick="showConfirm()">
        <i class="fas fa-check-circle"></i> Deposit Funds
      </button>
      <div style="text-align:center;margin-top:1rem">
        <a href="dashboard.html" style="font-size:0.85rem;color:var(--text-muted)"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </main>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="confirm-box">
      <div class="ci">&#128176;</div>
      <h3>Confirm Deposit</h3>
      <p>You are about to deposit</p>
      <div class="confirm-amount" id="confirmAmt">&#8377;0</div>
      <p id="confirmDesc" style="font-size:0.82rem;color:var(--text-muted)"></p>
      <div class="modal-actions mt-3">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" onclick="doDeposit()"><i class="fas fa-check"></i> Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="app.js"></script>
<script>
  const user = Auth.requireAuth();
  if (user && user.role === 'admin') window.location.href = 'admin.html';
  let userAccount = null;

  if (user) {
    renderSidebar('deposit');
    userAccount = AccountOps.getByCustomer(user.id);
    if (userAccount) {
      document.getElementById('balanceDisplay').innerHTML = formatCurrency(userAccount.balance);
      document.getElementById('accInfo').textContent = `${userAccount.accountNumber} | ${userAccount.accountType}`;
    }
  }

  function setAmount(val) { document.getElementById('depositAmount').value = val; }

  function showConfirm() {
    const amt  = parseFloat(document.getElementById('depositAmount').value);
    const desc = document.getElementById('depositDesc').value.trim();
    if (!amt || amt <= 0) { showToast('Please enter a valid amount.', 'warning'); return; }
    if (amt > 1000000)    { showToast('Maximum deposit limit is ₹10,00,000.', 'warning'); return; }
    document.getElementById('confirmAmt').innerHTML  = formatCurrency(amt);
    document.getElementById('confirmDesc').textContent = desc ? `Reason: ${desc}` : '';
    document.getElementById('confirmModal').classList.add('show');
  }

  function closeModal() { document.getElementById('confirmModal').classList.remove('show'); }

  function doDeposit() {
    const amt  = parseFloat(document.getElementById('depositAmount').value);
    const desc = document.getElementById('depositDesc').value.trim() || 'Cash Deposit';
    closeModal();

    const result = AccountOps.deposit(userAccount.id, amt, desc);
    if (result.success) {
      userAccount.balance = result.balance;
      document.getElementById('balanceDisplay').innerHTML = formatCurrency(result.balance);
      document.getElementById('depositAmount').value = '';
      document.getElementById('depositDesc').value   = '';
      AuditLog.add(user.id, user.email, 'DEPOSIT', `Deposited ${amt} — ${desc}`);
      showToast(`Successfully deposited ${formatCurrency(amt)}!`, 'success');
    } else {
      showToast(result.msg, 'error');
    }
  }
</script>
</body>
</html>
